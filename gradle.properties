## Use a JDK 25 installation for Gradle builds
# JavaFX 25 依赖 JDK 模块 jdk.jsobject，该模块在 JDK 26 中已移除，因此必须使用 JDK 25
org.gradle.java.home=C:/Program Files/Zulu/zulu-25

# 并行构建配置
org.gradle.parallel=true
# 禁用配置缓存（createAppImagePackage任务不支持）
org.gradle.configuration-cache=false
# 启用按需配置
org.gradle.configureondemand=true
# 增加JVM内存
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# 禁用任务名缩写（修复中文项目名导致的任务匹配问题）
org.gradle.cli.name-abbreviation=false
# 启用守护进程（默认已启用）
org.gradle.daemon=true
